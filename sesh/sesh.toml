#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

# Don't exit tmux when the last session is closed
# (set detach-on-destroy off in tmux.conf to complement this)

# Machine-local sessions (not committed)
import = ["~/.config/sesh/local.toml"]

blacklist = ["scratch"]

[default_session]
startup_command = "nvim -c ':lua require(\"telescope.builtin\").find_files()'"
preview_command = "eza --all --git --icons --color=always {}"

[[wildcard]]
pattern = "~/git/*"
startup_command = "nvim"

[[wildcard]]
pattern = "~/projects/*"
startup_command = "nvim"

[[session]]
name = "dotfiles"
path = "~/git/dotfiles"
startup_command = "nvim"
windows = ["df-opencode", "df-terminal"]

[[session]]
name = "schedulemaker"
path = "~/git/edu-main/Modules/ScheduleMaker/Frontend/Professional"
startup_command = "nvim"
windows = ["sm-backend", "sm-frontend", "sm-terminal"]

[[session]]
name = "eflux"
path = "~/git/edu-infra-eflux/EFlux.DesktopMonitor.Electron"
startup_command = "nvim"
windows = ["ef-opencode", "ef-start", "ef-terminal"]

[[window]]
name = "df-opencode"
startup_script = "opencode"

[[window]]
name = "df-terminal"
path = "~/git/dotfiles"

[[window]]
name = "sm-backend"
path = "~/git/edu-main/Modules/ScheduleMaker"
startup_script = "npm run start-no-frontend"

[[window]]
name = "sm-frontend"
path = "~/git/edu-main/Modules/ScheduleMaker/Frontend/Professional"
startup_script = "npm run start"

[[window]]
name = "sm-terminal"
path = "~/git/edu-main/Modules/ScheduleMaker/Frontend/Professional"

[[window]]
name = "ef-opencode"
path = "~/git/edu-infra-eflux/EFlux.DesktopMonitor.Electron"
startup_script = "opencode"

[[window]]
name = "ef-start"
path = "~/git/edu-infra-eflux/EFlux.DesktopMonitor.Electron"
startup_script = "pnpm start"

[[window]]
name = "ef-terminal"
path = "~/git/edu-infra-eflux/EFlux.DesktopMonitor.Electron"
