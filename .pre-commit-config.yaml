repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        stages: [pre-commit]
      # Public repo: scan the full history before anything leaves the machine.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full history)
        entry: gitleaks detect --verbose --redact
        pass_filenames: false
        always_run: true
        stages: [pre-push]
